name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version

      - name: Validar sintaxe
        run: bash -n install-monit-ilert.sh

      # -S error evita que uma versao mais nova do shellcheck, com checagens
      # novas, reprove o build por avisos de estilo. SC2034 e conhecido e
      # intencional (variavel de leitura no loop do df).
      - name: Analise estatica
        run: shellcheck -S error -e SC2034 install-monit-ilert.sh

      - name: Avisos (informativo, nao reprova)
        continue-on-error: true
        run: shellcheck -S warning -e SC2034 install-monit-ilert.sh

      # 'bash <arquivo>' em vez de './<arquivo>': independe do bit de execucao,
      # que pode se perder dependendo de como o arquivo foi commitado.
      - name: Dry-run nao-interativo
        run: sudo bash install-monit-ilert.sh --dry-run --yes --key CHAVE-FALSA --no-heartbeat

      - name: Dry-run com portas e auto-restart
        run: |
          sudo bash install-monit-ilert.sh --dry-run --yes --key CHAVE-FALSA \
            --no-heartbeat --auto-restart all --ports "app:8080:http"

      # Valida a configuracao gerada contra o Monit de verdade, nao so a
      # sintaxe do bash. Pega conflito de nome de check, sintaxe de teste
      # invalida e afins - coisas que o shellcheck nunca veria.
      - name: Validar config gerada com o Monit real
        run: |
          sudo apt-get install -y -qq monit
          monit -V | head -1
          for f in ilert.sh ilert-beat.sh ilert-flush.sh ilert-giveup.sh ilert-dns.sh; do
            sudo install -m 700 /dev/stdin "/usr/local/bin/$f" <<< '#!/bin/bash
          exit 0'
          done
          sudo bash install-monit-ilert.sh --yes --key CHAVE-FALSA --no-heartbeat \
            --connectivity none --auto-restart all || true
          sudo monit -t

      - name: Varredura de segredos
        run: |
          if grep -rnE 'il1(api|hbt|hb2)[0-9a-f]{16}|ih2:[0-9]+:[a-z]+:' \
               --include='*.sh' --include='*.md' .; then
            echo "ERRO: possivel chave real versionada"
            exit 1
          fi
          echo "nenhum segredo encontrado"
